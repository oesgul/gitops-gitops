apiVersion: v1
kind: ConfigMap
metadata:
  name: image-recognition-config
  labels:
    app: image-recognition-app
data:
  # Application configuration
  FLASK_ENV: "production"
  LOG_LEVEL: "INFO"
  
  # Image processing settings
  IMAGE_SIZE: "224,224"
  CONFIDENCE_THRESHOLD: "0.5"
  MAX_DETECTIONS: "10"
  BATCH_SIZE: "1"
  USE_GPU: "false"
  
  # File upload settings
  MAX_CONTENT_LENGTH: "16777216"  # 16MB
  
  # Model settings
  CLASSIFICATION_MODEL: "mobilenet_v2"
  DETECTION_MODEL: "ssd_mobilenet_v2"